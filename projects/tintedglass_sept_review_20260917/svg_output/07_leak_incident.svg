    <text x="108" y="184" font-size="24" font-weight="bold" fill="#123A5C">发现</text>
    <text x="64" y="220" font-size="18" fill="#17202A">augmented 池 516 个文件，只有 12 张内容<tspan x="64" dy="26">而且这 12 张全部就是测试集的 T</tspan></text>

    <text x="64" y="292" font-size="24" font-weight="bold" fill="#123A5C">影响</text>
    <text x="64" y="326" font-size="18" fill="#17202A">域匹配训练集整体泄漏，相关结果全部作废<tspan x="64" dy="26">按文件名与统计口径都查不出来，必须按内容核查</tspan></text>

    <text x="64" y="398" font-size="24" font-weight="bold" fill="#123A5C">处置</text>
    <text x="64" y="432" font-size="18" fill="#17202A">内容级泄漏核查（md5 + 感知哈希）固化为流程护栏<tspan x="64" dy="26">训练池按「谱匹配 + 对比度 + JPEG 重编」配方重建</tspan><tspan x="64" dy="26">新源 rrw_gt / real_tl 均已通过内容级核查</tspan></text>

    <text x="64" y="530" font-size="24" font-weight="bold" fill="#123A5C">教训</text>
    <text x="64" y="564" font-size="18" fill="#17202A">泄漏核查必须按内容，不能按文件名或统计口径<tspan x="64" dy="26">这条护栏已写进每一轮实验的准入检查</tspan></text>
