    <text x="838" y="198" font-size="24" font-weight="bold" fill="#123A5C" text-anchor="middle">SubNet × 4</text>
    <text x="838" y="224" font-size="18" fill="#5A6672" text-anchor="middle">可逆残差</text>
    <line x1="908" y1="198" x2="930" y2="198" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>

    <rect x="932" y="160" width="130" height="76" fill="#FFFFFF" stroke="#0E7C86" stroke-width="2"/>
    <text x="997" y="198" font-size="24" font-weight="bold" fill="#123A5C" text-anchor="middle">Decoder</text>
    <text x="997" y="224" font-size="18" fill="#5A6672" text-anchor="middle">唯一被调用</text>
    <line x1="1062" y1="198" x2="1084" y2="198" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>

    <rect x="1086" y="160" width="130" height="76" fill="#FFFFFF" stroke="#0E7C86" stroke-width="2"/>
    <text x="1151" y="198" font-size="24" fill="#123A5C" text-anchor="middle">R̂ / T̂</text>
