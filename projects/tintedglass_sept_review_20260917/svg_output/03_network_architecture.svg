    <rect x="64" y="458" width="316" height="36" fill="#F1F4F6"/>
    <text x="222" y="482" font-size="18" fill="#17202A" text-anchor="middle">调制残差</text>
    <line x1="380" y1="476" x2="398" y2="476" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>
    <rect x="400" y="458" width="140" height="36" fill="#C2410C"/>
    <text x="470" y="482" font-size="18" fill="#FFFFFF" text-anchor="middle">mona1</text>

    <rect x="64" y="512" width="316" height="36" fill="#F1F4F6"/>
    <text x="222" y="536" font-size="18" fill="#17202A" text-anchor="middle">FFN 残差</text>
    <line x1="380" y1="530" x2="398" y2="530" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>
    <rect x="400" y="512" width="140" height="36" fill="#C2410C"/>
    <text x="470" y="536" font-size="18" fill="#FFFFFF" text-anchor="middle">mona2</text>

    <text x="64" y="588" font-size="18" fill="#17202A">24 个 block × 2 = 48 个 Mona，新增 5.27M<tspan x="64" dy="26">主干全程冻结，只训适配器；配梯度重算换显存</tspan></text>
  </g>

  <g id="p03-budget" data-pptx-bounds="652 400 564 240">
