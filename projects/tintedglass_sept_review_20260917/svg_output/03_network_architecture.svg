    <text x="675" y="320" font-size="18" fill="#C2410C" text-anchor="middle">MLP 6→512→64</text>

    <line x1="675" y1="278" x2="675" y2="242" stroke="#C2410C" stroke-width="2" marker-end="url(#flowArrowAccent)"/>
