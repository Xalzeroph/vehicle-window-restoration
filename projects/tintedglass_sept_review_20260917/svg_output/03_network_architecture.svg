    <text x="525" y="224" font-size="18" fill="#5A6672" text-anchor="middle">192→64</text>
    <line x1="590" y1="198" x2="612" y2="198" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>

