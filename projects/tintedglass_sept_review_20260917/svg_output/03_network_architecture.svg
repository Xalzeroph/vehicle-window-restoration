    <line x1="64" y1="124" x2="1216" y2="124" stroke="#D5DCE2" stroke-width="1"/>
  </g>

  <g id="p03-pipeline" data-pptx-bounds="64 158 1152 122">
    <rect x="64" y="160" width="88" height="76" fill="#F1F4F6" stroke="#8A9099" stroke-width="1"/>
    <text x="108" y="198" font-size="24" fill="#5A6672" text-anchor="middle">输入 I</text>
    <text x="108" y="224" font-size="18" fill="#8A9099" text-anchor="middle">32 倍数</text>
    <line x1="152" y1="198" x2="174" y2="198" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>

