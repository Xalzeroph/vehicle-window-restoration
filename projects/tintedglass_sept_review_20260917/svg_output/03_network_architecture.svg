    <text x="679" y="198" font-size="24" fill="#C2410C" text-anchor="middle">α 门控 ⊗</text>
    <text x="679" y="224" font-size="18" fill="#C2410C" text-anchor="middle">仅调 stem</text>
    <line x1="744" y1="198" x2="766" y2="198" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>

