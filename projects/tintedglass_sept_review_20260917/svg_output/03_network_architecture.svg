    <text x="306" y="198" font-size="24" font-weight="bold" fill="#5A6672" text-anchor="middle">FocalNet-L</text>
    <text x="306" y="224" font-size="18" fill="#8A9099" text-anchor="middle">冻结 205.7M（含 Mona）</text>
    <line x1="436" y1="198" x2="458" y2="198" stroke="#5A6672" stroke-width="2" marker-end="url(#flowArrow)"/>

